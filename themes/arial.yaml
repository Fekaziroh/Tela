        - {type: value, sensor: cpu_power, x: 294, y: 88, size: 15, unit: ' W', align: right, font: arial, unit_size: 8}
        - {type: bar, sensor: cpu_load, x: 160, y: 100, w: 134, h: 3, min: 0, max: 100}
    - id: gpu
