clock:   # the Rest screen (absolute positions)
  landscape:
    - {type: panel, x: 90.0, y: 58, w: 300, h: 170, border: '#FFD34E', gradient: ['#8A1424', '#5A0B16'], gloss: 0.18, opacity: 0.92, radius: 16, shadow: 2}
