    - {type: clock, format: '{weekday} %d/%m', x: 240.0, y: 175.39999999999998, size: 15, align: center, color: secondary}
    - {type: clock, format: '{weather_only}', x: 240.0, y: 199.39999999999998, size: 13, align: center, color: accent}
  portrait:
