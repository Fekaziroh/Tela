        - {type: rect, x: 0, y: 13, w: 231, h: 9, color: '#2A73D9'}
        - {type: text, text: CPU, x: 10, y: 11, size: 10, color: '#FFFFFF', bold: true, font: verdana}
        - {type: text, text: '{cpu_name}', x: 221, y: 11, size: 9, color: '#E6F0FF', align: right, font: verdana}
        - {type: text, text: '#temp', x: 12, y: 40, size: 9, color: secondary, bold: true, font: verdana}
        - {type: value, sensor: cpu_temp, x: 219, y: 40, size: 18, unit: °C, align: right, unit_size: 9, bold: true, alerts: [{above: 75, color: warn}, {above: 85, color: crit}], font: verdana}
        - {type: bar, sensor: cpu_temp, x: 12, y: 52, w: 207, h: 12, min: 20, max: 95, gloss: 0.6, alerts: [{above: 75, color: warn}, {above: 85, color: crit}]}
        - {type: text, text: '#load', x: 12, y: 80, size: 9, color: secondary, bold: true, font: verdana}
