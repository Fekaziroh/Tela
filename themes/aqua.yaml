# Built-in Tela! screen theme (replaced by every update; your changes are kept apart).

name: {pt: Aqua, en: Aqua, es: Aqua, zh: Aqua}
order: 8
tela: 1

colors:
  background: '#ECECEC'
  panel: '#FFFFFF'
  text: '#1A1A1A'
  secondary: '#5A6068'
  track: '#D8E0E9'
  accent: '#2F7FE0'
  warn: '#F5A623'
  crit: '#E5383B'

landscape:
  art: aqua_l.png
  groups:
    - id: top
      name: '#top'
      x: 0
      y: 0
      w: 480
      h: 38
      items:
        - {type: panel, x: 6, y: 4, w: 468, h: 30, title: '', border: '#AEB6BF', color: '#FFFFFF', radius: 15, shadow: 1}
        - {type: value, sensor: fps, x: 20, y: 19, size: 18, unit: ' FPS', unit_size: 9, bold: true, empty: '', font: verdana}
        - {type: image, files: logos, x: 20, y: 12, w: 90, h: 14, when: no_fps}
        - {type: clock, format: '%H:%M', x: 240, y: 19, align: center, size: 18, bold: true, font: verdana}
        - {type: clock, format: '{weekday} %d/%m{weather}', x: 462, y: 19, align: right, size: 9.5, color: secondary, when: no_media_any, fade: true, font: verdana}
        - {type: media, x: 300, y: 6, w: 168, h: 26, when: media_any, fade: true}
    - id: cpu
      name: CPU
      x: 6
      y: 44
      w: 231
      h: 140
      items:
        - {type: panel, x: 0, y: 0, w: 231, h: 140, title: '', border: '#AEB6BF', color: '#FFFFFF', radius: 9, shadow: 2}
