clock:   # the Rest screen (absolute positions)
  landscape:
    - {type: panel, x: 80.0, y: 70.0, w: 320, h: 180, opacity: 0.84, radius: 12, shadow: 2}
    - {type: clock, format: '%H:%M', x: 240.0, y: 145.6, size: 64, align: center, bold: true}
    - {type: clock, format: '{weekday} %d/%m', x: 240.0, y: 191.6, size: 15, align: center, color: secondary}
    - {type: clock, format: '{weather_only}', x: 240.0, y: 215.6, size: 13, align: center, color: accent}
  portrait:
    - {type: panel, x: 20.0, y: 140.0, w: 280, h: 200, opacity: 0.84, radius: 12, shadow: 2}
    - {type: clock, format: '%H:%M', x: 160.0, y: 224.0, size: 56, align: center, bold: true}
