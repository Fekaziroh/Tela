        - {type: clock, format: '%H:%M:%S', x: 310, y: 16, align: right, size: 16, bold: true}
        - {type: clock, format: '{weekday} %d/%m{weather}', x: 10, y: 42, align: left, size: 10, color: secondary, when: no_media_any}
