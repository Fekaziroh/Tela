clock:   # the Rest screen (absolute positions)
  landscape:
    - {type: text, text: ◢ TELA!, x: 16, y: 22, size: 13, align: left, color: accent, bold: true}
    - {type: clock, format: '%H:%M', x: 240.0, y: 96.0, size: 92, align: center, bold: true}
    - {type: clock, format: ':%S', x: 380.0, y: 114.0, size: 22, align: left, color: accent, bold: true}
    - {type: clock, format: '{weekday} %d/%m', x: 240.0, y: 160.0, size: 16, align: center, color: secondary}
    - {type: clock, format: '{weather_only}', x: 240.0, y: 184.0, size: 14, align: center, color: accent}
  portrait:
    - {type: text, text: ◢ TELA!, x: 16, y: 22, size: 13, align: left, color: accent, bold: true}
    - {type: clock, format: '%H:%M', x: 160.0, y: 134.4, size: 70, align: center, bold: true}
    - {type: clock, format: ':%S', x: 268.0, y: 152.4, size: 22, align: left, color: accent, bold: true}
    - {type: clock, format: '{weekday} %d/%m', x: 160.0, y: 190.4, size: 16, align: center, color: secondary}
    - {type: clock, format: '{weather_only}', x: 160.0, y: 214.4, size: 14, align: center, color: accent}
