clock:   # the Rest screen (absolute positions)
  landscape:
    - {type: panel, x: 90.0, y: 24, w: 300, h: 170, border: '#F5C6DA', color: '#FFFFFF', opacity: 0.92, radius: 24, shadow: 1}
    - {type: clock, format: '%H:%M', x: 240.0, y: 95.39999999999999, size: 64, align: center, bold: true, font: verdana}
    - {type: clock, format: '{weekday} %d/%m', x: 240.0, y: 141.39999999999998, size: 15, align: center, color: secondary, font: verdana}
    - {type: clock, format: '{weather_only}', x: 240.0, y: 165.39999999999998, size: 13, align: center, color: accent, font: verdana}
  portrait:
    - {type: panel, x: 25.0, y: 80, w: 270, h: 190, border: '#F5C6DA', color: '#FFFFFF', opacity: 0.92, radius: 24, shadow: 1}
    - {type: clock, format: '%H:%M', x: 160.0, y: 159.8, size: 56, align: center, bold: true, font: verdana}
    - {type: clock, format: '{weekday} %d/%m', x: 160.0, y: 205.8, size: 15, align: center, color: secondary, font: verdana}
    - {type: clock, format: '{weather_only}', x: 160.0, y: 229.8, size: 13, align: center, color: accent, font: verdana}
