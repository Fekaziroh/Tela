# Tela! settings. Everything here can be changed in the app window.
# Screen: 480x320 landscape. Coordinates in pixels from the top-left corner;
# for texts and values "y" is the vertical CENTER.

display:
  mode: functional             # functional (sensors) | visual (a picture, photos, a GIF or the clock: section visual)
  port: auto                   # or "COM5"
  orientation: landscape_flipped   # landscape | landscape_flipped
  brightness: 40               # 0-100 (very high values can make the screen unstable)
  off_on_exit: true            # black screen when the app closes or the PC shuts down
  off_on_lock: true            # off while the PC is locked (Win+L)
  off_with_monitor: true       # off while the monitor sleeps
  night_enabled: false
  night_brightness: 15
  night_start: "22:00"
  night_end: "07:00"
  off_enabled: false           # screen off during these hours
  off_start: "02:00"
  off_end: "07:00"

ui:
  theme: auto                  # auto (follows Windows) | light | dark | screen | preset:<name> | custom:<name>
  style: default               # default (full window) | compact (a narrow window, menu at the bottom)
  language: auto               # auto (follows Windows) | pt | en | es | zh
  wizard_done: false           # the first-run assistant was finished
  reflow: true                 # layout editor: neighbour blocks follow when one is deleted or resized
  unload_hidden: false         # empty the window while it is in the tray (frees memory; it reloads when opened)
  guard: true                  # a small guard process reopens Tela! if it freezes (takes effect on the next start)

theme:
  name: clean                  # screen theme (Appearance tab): clean | full | cockpit | lines | retro | one of yours
  notice: false                # show the "new themes" notice once (set when updating from 1.4.5 or older)
  schedule: false              # switch themes by the time of day
  day: clean                   # theme during the day
  night: retro                 # theme at night (between night_start and night_end)
  night_start: "19:00"
  night_end: "07:00"
  festive: false               # Halloween in October and Christmas in December, then your theme again
  before_festive: ""           # (kept by Tela!) the theme to bring back after the festive month

weather:                       # next to the date on the screen (Open-Meteo: only the city and its coordinates go online)
  enabled: true
  city: ""                     # empty = no weather
  unit: celsius                # celsius | fahrenheit
  temperature: true
  condition: true              # sunny, cloudy, rain...

tray:
  temp_icon: none              # none | cpu | gpu  (temperature drawn in the tray icon)

eco:
  enabled: true                # when you are away and no game is running: slower reads, no animations
  idle_minutes: 5
  interval: 3

interval: 1.0                  # seconds between sensor reads

fps:
  show_game: false             # the game's name, small, under the FPS on the screen
  update: 0.2                  # seconds between FPS/volume updates on the screen
  average: 0.5                 # seconds averaged for the FPS
  source: auto                 # auto (PresentMon, or RTSS if it is open) | presentmon | rtss
  ignore: [dwm.exe, explorer.exe, tela.exe, chrome.exe, msedge.exe, msedgewebview2.exe, firefox.exe, opera.exe,
           brave.exe, discord.exe, steamwebhelper.exe, spotify.exe, searchhost.exe, startmenuexperiencehost.exe,
           shellexperiencehost.exe, textinputhost.exe, applicationframehost.exe]

network:
  ping: true
  servers: "1.1.1.1, 8.8.8.8"
  ping_interval: 2
  fails_for_outage: 3
  warn_ms: 60
  crit_ms: 150
  warn_loss: 2                 # % of the last 30 pings
  crit_loss: 10

logos:
  mode: auto                   # auto (hardware brands) | list
  files: ""
  color: white                 # white | original
  switch_every: 20
  fade: 1.2

media:
  enabled: true
  during_game: date            # date (shows the music where the date is) | hide
  progress: true
  ignore: ""

background:
  image: ""                    # picture behind the panels (Appearance tab)
  dim: 40                      # % darker, so the numbers stay readable
  panel_opacity: 85            # % panel opacity over the picture

visual:                        # Appearance › Screen mode › Visual
  kind: clock                  # clock (the theme's Rest screen) | image | photos (one after the other) | gif
  files: ""                    # pictures copied to the "visual" folder, separated by |
  every: 15                    # photos: seconds each
  clock: true                  # a small clock over the picture

rest:
  enabled: false               # Rest: with the PC idle, a big clock with the date and the weather
  idle_minutes: 10

ssd:
  number: activity             # activity (number = activity, bar = used space) | space
  title: ""                    # title of the disks block; empty = automatic (SSD, HD or Disks)

session:
  summary: true
  summary_seconds: 15
  min_minutes: 5
  show_fps: true               # what the summary shows
  show_temps: true
  show_graph: true
  show_duration: true
  graph: bottom                # bottom | top
  temperatures: {cpu: cpu_temp, gpu: gpu_temp, hotspot: gpu_hotspot}

history:
  save: true                   # keep every game summary
  keep: 15                     # how many games to keep (0 = all)
  folder: ""                   # empty = the "games" folder next to the settings

performance:                   # the presets in Settings change these together with a few intervals
  quality: high                # high (2x supersampled, smoother edges) | normal (less CPU)
  preview: true                # live preview in the window (off = less CPU while the window is open)
  preview_quality: sharp       # sharp (the supersampled picture) | normal (the screen's own pixels, less CPU)

alerts:
  enabled: false               # a Windows notice when a temperature stays high (once, then quiet for a while)
  cpu: 90                      # °C
  gpu: 85                      # °C
  seconds: 20                  # how long above the limit before the notice
  quiet_minutes: 15            # no new notice for the same part during this time

updates:
  check: true                  # look for a new Tela! on GitHub (at start and every 6 hours)
  hours: 6                     # time between automatic checks (2 to 24)
  test: false                  # also offer test versions (GitHub pre-releases)
  skip: ""                     # a version not to offer (set when going back to an older one)

intervals:                     # slower items (seconds); they show the average of the period
  net_down: 3
  net_up: 3
  disk1: 30
  disk2: 30

animation:
  enabled: true
  duration: 0.6
  fps: 8
  transition_theme: cascade    # theme change: cascade | eink | glitch | curtain | none
  transition_summary: cascade  # game summary and Rest coming in and out: same choices

data:
  source: auto                 # auto | embedded | web (LibreHardwareMonitor web server)
  lhm_url: http://localhost:8085/data.json
  disk_interval: 2
  controllers: false           # also read fan/AIO controllers (Corsair, NZXT...)
  hwinfo: false                # also read HWiNFO (its "Shared Memory Support" on): its main values win
  net_interface:               # empty = all adapters

fonts:
  regular: ["bahnschrift.ttf", "segoeui.ttf", "DejaVuSans.ttf"]
  bold: ["bahnschrift.ttf:Bold", "segoeuib.ttf", "DejaVuSans-Bold.ttf"]

colors:
  background: "#000000"
  panel: "#141414"
  text: "#FFFFFF"
  secondary: "#8C8C8C"
  track: "#333333"
  accent: "#FFFFFF"
  warn: "#FF9F0A"
  crit: "#FF453A"

texts:                         # your own words for the screen labels (Settings › Screen texts); empty = the language's word

custom_colors:                 # the "Custom" screen theme (filled when you edit a color)
