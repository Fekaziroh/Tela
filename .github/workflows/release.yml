# Builds the Windows setup. Every push to main uploads it as an artifact; when engine.VERSION has no
# release yet, the push also creates the release "v<version>" with the notes from ui/changelog.js and
# attaches Tela-Setup-<version>.exe and Tela-Setup.exe (the fixed name the updater downloads).
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Libraries
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Tests
        shell: pwsh
        run: |
          $out = python tests/run_tests.py 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE) {
            $tail = ($out -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -Last 80) -join '%0A'
            Write-Host "::error title=Tests failed::$tail"
            exit 1
          }

      - name: Components (LibreHardwareMonitor, PresentMon, PawnIO link)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./installer/fetch_components.ps1 -Out build/components

      - name: Tela.exe
        shell: pwsh
        run: |
          python -c "from icon import save_ico; save_ico(r'build\tela.ico')"
          python installer/version_info.py build\version_info.txt
          python -m PyInstaller --noconfirm --clean --onedir --windowed --uac-admin --log-level ERROR --name Tela `
            --icon "$PWD\build\tela.ico" --version-file "$PWD\build\version_info.txt" --distpath build\dist --workpath build\work --specpath build `
            --hidden-import pystray._win32 --hidden-import webview.platforms.edgechromium --hidden-import webview.platforms.winforms `
            --collect-all pythonnet --collect-all clr_loader --collect-all winrt --collect-data webview app.py

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (python -c "import engine; print(engine.VERSION)").Trim()
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") { throw "tag $env:GITHUB_REF_NAME does not match version $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $pawn = Get-Content build\components\pawnio_url.txt -Raw
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DPawnIOUrl=$pawn" installer\Tela.iss
          if ($LASTEXITCODE) { throw 'Inno Setup failed' }

      - uses: actions/upload-artifact@v5
        with:
          name: Tela-Setup-${{ steps.version.outputs.version }}
          path: build/Tela-Setup-*.exe

      - name: Promote approved experimental versions
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # a test version whose "beta" was removed in ui/changelog.js becomes a normal (stable) release,
          # even when a newer test version already exists; oldest first, so "latest" ends on the newest stable
          foreach ($v in (python installer/changelog.py --stable)) {
            $v = $v.Trim(); if (-not $v) { continue }
            $r = gh release view "v$v" --json isPrerelease 2>$null | ConvertFrom-Json
            if ($LASTEXITCODE -eq 0 -and $r -and $r.isPrerelease) {
              gh release edit "v$v" --prerelease=false --latest --title "Tela! $v"
              Write-Host "v$v promoted from experimental to stable"
            }
          }
          exit 0

      - name: Withdraw versions taken back
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # "withdrawn": true in ui/changelog.js: the setups go away (the app no longer offers that version, not
          # even in "Go back to another version") and the release notes say why
          foreach ($v in (python installer/changelog.py --withdrawn)) {
            $v = $v.Trim(); if (-not $v) { continue }
            $r = gh release view "v$v" --json assets 2>$null | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $r -or -not $r.assets) { continue }
            foreach ($a in $r.assets) { gh release delete-asset "v$v" $a.name -y }
            python installer/changelog.py --notes $v | Out-File -Encoding utf8 build\withdrawn.md
            gh release edit "v$v" --notes-file build\withdrawn.md --title "Tela! $v (withdrawn)"
            Write-Host "v$v withdrawn"
          }
          exit 0

      - name: Version tags follow main's commits
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          # every "Tela! x.y.z" commit on main carries the tag vx.y.z (when main's history is rewritten, the tags move with it)
          git fetch -q --tags --force origin
          foreach ($line in (git log --format="%H %s" HEAD)) {
            if ($line -notmatch '^(\w+) Tela! (\d+\.\d+\.\d+)$') { continue }
            $sha = $Matches[1]; $tag = "v$($Matches[2])"
            $cur = git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>$null
            if (-not $cur -or $cur -eq $sha) { continue }
            git tag -f $tag $sha
            git push -f origin "refs/tags/$tag"
            Write-Host "$tag now points to $sha"
          }
          exit 0

      - name: Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $channel = (python installer/changelog.py --channel $v).Trim()
          if ($channel -eq 'draft') { Write-Host "v$v is still a draft in ui/changelog.js: no release yet"; exit 0 }
          $existing = gh release view "v$v" --json isPrerelease 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0 -and $existing) {
            if ($channel -eq 'stable' -and $existing.isPrerelease) {
              gh release edit "v$v" --prerelease=false --latest --title "Tela! $v"
              Write-Host "v$v promoted from experimental to stable"
            } elseif ($channel -eq 'test' -and $existing.isPrerelease) {
              # the same experimental version built again (a fix before it was approved): new setup and notes,
              # and the tag moves to this commit
              Copy-Item "build\Tela-Setup-$v.exe" build\Tela-Setup.exe
              python installer/changelog.py --notes $v | Out-File -Encoding utf8 build\notes.md
              gh release upload "v$v" "build\Tela-Setup-$v.exe" build\Tela-Setup.exe --clobber
              if ($LASTEXITCODE) { throw 'could not replace the setup' }
              gh release edit "v$v" --notes-file build\notes.md --title "Tela! $v (experimental)"
              git tag -f "v$v" $env:GITHUB_SHA
              git push -f origin "refs/tags/v$v"
              Write-Host "v$v (experimental) rebuilt from this commit"
            } else { Write-Host "v$v is already released: nothing to publish" }
            exit 0
          }
          Copy-Item "build\Tela-Setup-$v.exe" build\Tela-Setup.exe
          python installer/changelog.py --notes $v | Out-File -Encoding utf8 build\notes.md
          if ($LASTEXITCODE) { throw 'no patch notes for this version' }
          $kind = if ($channel -eq 'test') { '--prerelease' } else { '--latest' }
          $title = if ($channel -eq 'test') { "Tela! $v (experimental)" } else { "Tela! $v" }
          gh release create "v$v" --target $env:GITHUB_SHA --title $title --notes-file build\notes.md $kind `
            "build\Tela-Setup-$v.exe" build\Tela-Setup.exe
          if ($LASTEXITCODE) { throw 'could not create the release' }

      - name: Release notes follow ui/changelog.js
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # notes edited later (shorter, clearer) also change on the GitHub releases already published
          foreach ($v in (python installer/changelog.py --stable) + (python installer/changelog.py --withdrawn)) {
            $v = $v.Trim(); if (-not $v) { continue }
            gh release view "v$v" --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) { continue }
            python installer/changelog.py --notes $v | Out-File -Encoding utf8 build\sync.md
            gh release edit "v$v" --notes-file build\sync.md | Out-Null
          }
          exit 0

  # README pictures: drawn from the real window in demo mode and kept on the "screenshots" branch (main keeps
  # one commit per version). Updated when a version is released as stable, or when the branch is missing.
  screenshots:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Should the pictures change?
        id: need
        run: |
          v=$(grep -oP 'VERSION = "\K[^"]+' engine.py)
          channel=$(python installer/changelog.py --channel "$v")
          if [ "$channel" = "stable" ] || ! git ls-remote --exit-code --heads origin screenshots >/dev/null; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Pictures
        if: steps.need.outputs.go == 'yes'
        run: |
          python -m pip install --quiet pillow pyyaml psutil numpy pyserial playwright
          python -m playwright install --with-deps chromium
          python tests/screenshots.py build/shots
      - name: Publish on the screenshots branch
        if: steps.need.outputs.go == 'yes'
        run: |
          cd build/shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "README pictures"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots

